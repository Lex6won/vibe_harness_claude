# 승인 Track 정의 — 플랫폼 4-Track 매핑 (포크 금지)
# solution-architect가 자동 선정. 미승인은 거절이 아니라 선회 코칭.

tracks:
  local-automation:
    등급: 1  # 개인 도구
    용도: 개인 PC 자동화·파일 정리
    선정: 자동
  streamlit-internal:
    플랫폼: Track S
    용도: 내부 대시보드·분석 도구
    선정: 자동
    제약: "내부 한정 — 외부망/대민 금지"
  fastapi-web:
    플랫폼: Track A
    용도: 표준 내부 웹서비스 (기본값)
    선정: 자동(기본)
    스택: Python 3.12 + FastAPI + Jinja2/HTMX
  react-fastapi:
    플랫폼: Track B
    용도: 화면이 복잡한 서비스
    선정: 조건(화면 복잡성)
    스택: React(Vite)+TS 정적빌드 + FastAPI API
  node-api:
    플랫폼: Track N
    용도: Node 백엔드
    선정: "숨김 — 사용자가 정당 사유(기존 TS 재사용·Lovable 포팅) 언급 시만"
    제약: "승인 템플릿(gg-node-api), 서버용 npm 화이트리스트, 대민은 팀단 재심사"

denied:                 # 미승인 → 가까운 승인 Track + 선회 방법 코칭
  - stack: Next.js SSR
    선회: "정적 export는 Track B로 흡수, SSR은 2단계 재검토"
  - stack: [Spring Boot, Django, Flask]
    선회: "Flask→FastAPI 선회 안내"
  - stack: [supabase-js 직접, firebase]
    선회: "DB→PostgreSQL, Auth→org-environment.yaml의 auth_provider로 치환, 데이터 호출은 api 계층 분리"
  - stack: PHP
    선회: 표준 외
  - stack: "org-environment.yaml runtime.languages.approved 밖의 언어/런타임"
    선회: "요청 기능이 요구하는 언어가 기관 승인 언어 목록 밖이면, 가장 가까운 승인 언어(Python/Node)로 구현 가능한지 먼저 검토 → 정말 불가하면 예외신청(exception-policy.md)"

# 런타임 버전(Python/Node/PostgreSQL)은 이 파일에 중복 기재하지 않는다.
# 유일한 출처는 org-environment.yaml의 runtime 블록.
# 언어 자체의 승인 여부는 서버사양·OS로 추천하지 않고 org-environment.yaml
# runtime.languages.approved 선언값만 따른다(근거는 org-environment.yaml 주석 참고).
